<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando... - PatologíaControl</title>
    <link rel="icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes llenarBarra {
            from { width: 0%; }
            to { width: 100%; }
        }
        .barra-progreso {
            animation: llenarBarra 3s linear forwards;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm p-8 rounded-2xl shadow-md border border-slate-200 flex flex-col items-center text-center">
        <img src="logo.png" alt="Logo PatologíaControl" class="h-24 w-auto max-w-[260px] object-contain mb-3">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-1">
            Patología<span class="text-red-400">Control</span>
        </h1>
        <p class="text-xs text-slate-500 mb-6">
            Preparando acceso al sistema... (<span id="contador-seg" class="font-mono font-bold text-slate-700">3</span>s)
        </p>

        <!-- Barra de carga de 3 segundos -->
        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 barra-progreso rounded-full"></div>
        </div>
    </div>

    <script>
        let segundosRestantes = 3;
        const contadorEl = document.getElementById('contador-seg');

        const intervalo = setInterval(() => {
            segundosRestantes -= 1;
            if (segundosRestantes >= 0 && contadorEl) {
                contadorEl.innerText = segundosRestantes;
            }
            if (segundosRestantes <= 0) {
                clearInterval(intervalo);
                window.location.href = 'login.html';
            }
        }, 1000);
    </script>
</body>
</html>
